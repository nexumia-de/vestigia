id: de.nexumia.Vestigia
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: vestigia
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The user's Dawarich server and upload targets, and OSM map tiles
  # (docs/dawarich-api.md, docs/tracking.md). Location and secrets come
  # through portals and need no permission here.
  - --share=network
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - '*.a'
  - '*.la'
# Every module pins exact versions and checksums. x-checker-data lets
# flatpak-external-data-checker propose updates (weekly, see
# .github/workflows/update-check.yml); every module installs its licence
# texts into /app/share/licenses/<app id>/<module>/, which CI checks.
# Inventory with licences: docs/dependencies.md.
modules:
  # The map widget (docs/decisions/map-libshumate.md), as in Cirro until the
  # toolkit has a shared snippet (nexumia-de/phosh-toolkit#22):
  # org.gnome.Platform//51 ships neither libshumate nor protobuf-c.
  - name: protobuf-c
    buildsystem: autotools
    config-opts:
      - --disable-protoc
    post-install:
      - install -Dm644 LICENSE -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/protobuf-c
    sources:
      - type: archive
        url: https://github.com/protobuf-c/protobuf-c/releases/download/v1.5.2/protobuf-c-1.5.2.tar.gz
        sha256: e2c86271873a79c92b58fef7ebf8de1aa0df4738347a8bd5d4e65a80a16d0d24
        x-checker-data:
          type: json
          url: https://api.github.com/repos/protobuf-c/protobuf-c/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name == "protobuf-c-" + $version + ".tar.gz") | .browser_download_url

  - name: libshumate
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dgtk_doc=false
      - -Dvapi=false
      - -Ddemos=false
      - -Dsysprof=disabled
    post-install:
      # meson builds in _flatpak_build/, the licence is in the source root.
      - install -Dm644 ../COPYING -t ${FLATPAK_DEST}/share/licenses/${FLATPAK_ID}/libshumate
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libshumate/1.7/libshumate-1.7.0.tar.xz
        sha256: 3896cc4b6a7bf83141c27df23ce48cdd68467603bc6b764960307cdcbbef80e5
        x-checker-data:
          type: gnome
          name: libshumate
          stable-only: true

  # Shared settings and style code (phosh-toolkit
  # docs/shared-connection.md), next to Vestigia's package in site-packages.
  - name: phosh-toolkit
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib", vars={"base":"/app"}))')/phosh_toolkit" lib/phosh_toolkit/*.py
      - install -Dm644 -t /app/share/licenses/$FLATPAK_ID/phosh-toolkit LICENSE
    sources:
      - type: git
        url: https://github.com/nexumia-de/phosh-toolkit.git
        tag: v0.4.0
        commit: 89e3505aa290c4303e707229e09b33c3d4357fee
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: vestigia
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - build-dir
          - repo
          - tests
          - dev
          - .phosh-toolkit
