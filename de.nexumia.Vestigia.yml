id: de.nexumia.Vestigia
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: vestigia
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # The user's Dawarich server and upload targets, and OSM map tiles
  # (docs/dawarich-api.md, docs/tracking.md). Location and secrets come
  # through portals and need no permission here.
  - --share=network
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - '*.a'
  - '*.la'
# Every module pins exact versions and checksums. x-checker-data lets
# flatpak-external-data-checker propose updates (weekly, see
# .github/workflows/update-check.yml); every module installs its licence
# texts into /app/share/licenses/<app id>/<module>/, which CI checks.
# Inventory with licences: docs/dependencies.md.
modules:
  # The map widget (docs/decisions/map-libshumate.md) with protobuf-c:
  # the toolkit's shared module file, through the git submodule toolkit/
  # at the same tag as the phosh-toolkit module below
  # (phosh-toolkit docs/toolkit-usage.md, "Shared Flatpak modules").
  - toolkit/flatpak/libshumate.yml

  # Shared code: settings, style, keyring, HTTP, tasks, own location
  # (phosh-toolkit docs/shared-connection.md), next to Vestigia's package
  # in site-packages.
  - name: phosh-toolkit
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib", vars={"base":"/app"}))')/phosh_toolkit" lib/phosh_toolkit/*.py
      - install -Dm644 -t /app/share/licenses/$FLATPAK_ID/phosh-toolkit LICENSE
    sources:
      - type: git
        url: https://github.com/nexumia-de/phosh-toolkit.git
        tag: v0.8.1
        commit: 1910057162098f0963b44623e91b3650f685c49b
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: vestigia
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - build-dir
          - repo
          - tests
          - dev
          - toolkit
          - .phosh-toolkit
