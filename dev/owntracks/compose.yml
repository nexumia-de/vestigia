# OwnTracks Recorder for recording the answers of a second upload
# receiver (docs/dev-environment.md). HTTP only, MQTT off, listening on
# 127.0.0.1:8083. Usage: docker compose -f dev/owntracks/compose.yml up -d
name: vestigia-owntracks
services:
  recorder:
    image: owntracks/recorder:latest@sha256:8d48df647eb280bb94668658b7fc7ad3b47b9a7307e252aaf63d4c3681c6deaf # 1.0.7
    environment:
      OTR_PORT: "0"
      OTR_HTTPHOST: 0.0.0.0
    ports:
      - "127.0.0.1:8083:8083"
