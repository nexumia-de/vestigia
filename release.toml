# Release automation: changelog fragments, release pull request and
# screenshots (phosh-toolkit docs/releases.md).
metainfo = "data/de.nexumia.Vestigia.metainfo.xml"
version-files = ["meson.build", "vestigia/__init__.py"]

# Shots use the answers recorded from a real Dawarich server
# (tests/data/dawarich/, docs/dev-environment.md), never live data; map
# tiles come from OpenStreetMap.
[screenshots]
env = { VESTIGIA_DEMO_DATA = "{root}/tests/data/dawarich" }
expose = ["{root}/tests/data/dawarich"]
delay = 6

[[screenshots.shot]]
name = "day"
caption = "The tracks and visits of a day on the map"

[[screenshots.shot]]
name = "summary"
caption = "Distance, time moving and visits of the day"
actions = ["app.show-summary"]
