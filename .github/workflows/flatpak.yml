name: Flatpak
on:
  push:
    branches: [main]
    # v<version> publishes the stable app (phosh-toolkit docs/flatpak-workflow.md).
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  flatpak:
    permissions:
      contents: write
    uses: nexumia-de/phosh-toolkit/.github/workflows/flatpak.yml@1910057162098f0963b44623e91b3650f685c49b # v0.8.1
    with:
      manifest: de.nexumia.Vestigia.yml
      # Tags publish Travel Log, every push to main publishes Travel Log (Nightly);
      # nexumia-de/phosh-apps serves both (phosh-toolkit docs/flatpak-workflow.md).
      release: true
      nightly: true
      publish-repo: nexumia-de/phosh-apps
    secrets:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
