name: Bug report
description: Something in Vestigia does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Vestigia
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: From About Vestigia, e.g. "0.1.0" or "0.1.0 (main · 1a2b3c4)".
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Phone (Phosh)
        - Desktop
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Output of `VESTIGIA_DEBUG=1 flatpak run de.nexumia.Vestigia`, if available.
      render: text
